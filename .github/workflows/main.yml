name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip autoconf automake autopoint \
            libtool pkg-config zlib1g-dev \
            libncurses5-dev libncursesw5-dev libtinfo5 \
            cmake libffi-dev libssl-dev build-essential \
            ccache libltdl-dev libsqlite3-dev \
            libjpeg-dev libpng-dev curl wget \
            python3-venv

      - name: Check project files
        run: |
          python - <<'PY'
          from pathlib import Path

          required = [
              "main.py",
              "calculations.py",
              "buildozer.spec",
              "assets/font.ttf",
              "icon.png",
              "company_banner.png",
              "Screenshot_20261015-203531.png",
          ]

          missing = [
              name for name in required
              if not Path(name).is_file()
          ]

          if missing:
              for name in missing:
                  print(f"::error::Missing file: {name}")
              raise SystemExit(1)

          print("All required files are present.")
          PY

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            buildozer==1.5.0 \
            Cython==0.29.36 \
            virtualenv==20.26.6

      - name: Check Python syntax
        run: |
          python -m py_compile main.py calculations.py

      - name: Build APK
        shell: bash
        run: |
          set -o pipefail
          buildozer -v android debug 2>&1 | tee build.log

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ndt-apk
          path: bin/*.apk
          if-no-files-found: error

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore
